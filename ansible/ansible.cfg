[defaults]
# Inventario relativo a este archivo (ansible/inventario.ini).
# Se genera con: python3 scripts/generar_inventario.py
inventory = inventario.ini

# Colecciones del sistema y del usuario.
collections_paths = ~/.ansible/collections:/usr/share/ansible/collections

# Los MikroTik del laboratorio GNS3 regeneran sus claves SSH en cada arranque.
# Se desactiva la comprobación de host key SOLO para este entorno de laboratorio.
host_key_checking = False

retry_files_enabled = False
deprecation_warnings = False
interpreter_python = auto_silent
stdout_callback = default
display_skipped_hosts = False

[persistent_connection]
# Tiempos holgados: RouterOS en GNS3 responde lento en equipos virtualizados.
connect_timeout = 30
command_timeout = 45

[ssh_connection]
# Evita reutilizar conexiones persistentes obsoletas tras reiniciar la topología.
pipelining = False
