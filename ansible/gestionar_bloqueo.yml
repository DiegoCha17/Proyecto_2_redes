---
- name: Gestionar bloqueo administrado de NetAgent-IA en R1
  hosts: r1
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: community.routeros.routeros
    ansible_network_cli_ssh_type: libssh
  tasks:
    - name: Validar parámetros de la operación
      ansible.builtin.assert:
        that:
          - ip is string
          - ip is match('^192\.168\.10\.(0|[2-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$')
          - accion in ['bloquear', 'permitir']
        fail_msg: La operación requiere una IPv4 LAN autorizada y una acción bloquear o permitir.
      no_log: true

    - name: Prelectura de estado actual
      community.routeros.command:
        commands:
          - ':put "NETAGENT_BEGIN_V1"'
          - ':foreach r in=[/ip firewall filter print as-value where comment="NETAGENT_LAB_{{ ip }}"] do={ :put "NETAGENT_RULE_BEGIN_V2"; :foreach k,v in=$r do={ :put ("NETAGENT_PROP|" . $k . "|" . [:tostr $v]) }; :put "NETAGENT_RULE_END_V2" }'
          - ':put "NETAGENT_END_V1"'
      register: pre_lectura
      changed_when: false
      # La salida contiene únicamente propiedades de la regla con etiqueta
      # NETAGENT_LAB_<ip>; no contiene credenciales.
      no_log: false

    - name: Procesar prelectura
      ansible.builtin.include_tasks: tareas/procesar_gestion_bloqueo.yml
      vars:
        netagent_fase: pre

    - name: Aplicar bloqueo
      community.routeros.command:
        commands:
          - '/ip firewall filter add chain=forward src-address={{ ip }} dst-address=172.16.100.10 action=drop comment="NETAGENT_LAB_{{ ip }}" place-before=0'
      when:
        - accion == 'bloquear'
        - not bloqueada_antes
      register: aplicacion_bloqueo
      changed_when: >-
        'no such item' not in ((aplicacion_bloqueo.stdout | default([]) | join(' ')) | lower)
      no_log: true

    - name: Aplicar bloqueo sin posición cuando la tabla está vacía
      community.routeros.command:
        commands:
          - '/ip firewall filter add chain=forward src-address={{ ip }} dst-address=172.16.100.10 action=drop comment="NETAGENT_LAB_{{ ip }}"'
      when:
        - accion == 'bloquear'
        - not bloqueada_antes
        - "'no such item' in ((aplicacion_bloqueo.stdout | default([]) | join(' ')) | lower)"
      changed_when: true
      no_log: true

    - name: Quitar bloqueo
      community.routeros.command:
        commands:
          - '/ip firewall filter remove [/ip firewall filter find where comment="NETAGENT_LAB_{{ ip }}"]'
      when:
        - accion == 'permitir'
        - bloqueada_antes
      register: retiro_bloqueo
      changed_when: true
      no_log: true

    - name: Poslectura de estado final
      community.routeros.command:
        commands:
          - ':put "NETAGENT_BEGIN_V1"'
          - ':foreach r in=[/ip firewall filter print as-value where comment="NETAGENT_LAB_{{ ip }}"] do={ :put "NETAGENT_RULE_BEGIN_V2"; :foreach k,v in=$r do={ :put ("NETAGENT_PROP|" . $k . "|" . [:tostr $v]) }; :put "NETAGENT_RULE_END_V2" }'
          - ':put "NETAGENT_END_V1"'
      register: post_lectura
      changed_when: false
      # Igual que la prelectura: solo devuelve propiedades de la etiqueta
      # administrada y debe quedar disponible para el parser.
      no_log: false

    - name: Procesar poslectura y construir contrato
      ansible.builtin.include_tasks: tareas/procesar_gestion_bloqueo.yml
      vars:
        netagent_fase: post

    - name: Resultado JSON de NetAgent-IA
      ansible.builtin.debug:
        var: netagent_resultado
